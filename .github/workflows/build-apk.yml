name: Build DZ-CHAT APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest DZ-CHAT web files into assets
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL "https://raw.githubusercontent.com/manarefathi31-afk/dz-chat/main/index.html" -o app/src/main/assets/index.html
          curl -fsSL "https://raw.githubusercontent.com/manarefathi31-afk/dz-chat/main/style.css" -o app/src/main/assets/style.css
          curl -fsSL "https://raw.githubusercontent.com/manarefathi31-afk/dz-chat/main/script.js" -o app/src/main/assets/script.js
          ls -lh app/src/main/assets

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses and Install Android 35
        run: |
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload DZ-CHAT APK
        uses: actions/upload-artifact@v4
        with:
          name: DZ-CHAT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
